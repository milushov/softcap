name: Release

# Every push to main that changes the app produces a downloadable build, and
# the release notes open with the commits that changed it. A push that changed
# nothing in the app — the site, the store listing, a tool — runs the tests and
# publishes nothing: the version number would move and the app would not, and
# the updater would offer everyone a download that changes nothing. The
# README link never has to change: GitHub keeps
# /releases/latest/download/<name> pointing at the newest release, so the
# workflow uploads the disk image twice — once under its version, once under a
# fixed name for that URL to resolve.

on:
  push:
    branches: [main]
    # Doc-only pushes produce an identical binary, and the README is rewritten
    # by this workflow itself — without this the run would trigger itself.
    #
    # One trap this cannot see, and it has caught a push already: GitHub reads
    # its skip-CI marker anywhere in a commit message, body included, so a
    # message that merely quotes the marker while explaining it publishes the
    # commit and starts nothing at all. There is no run to look at afterwards —
    # not a red one, none — and the release simply never happens. Write about
    # the marker without spelling it, or the next reader of this file finds out
    # the same way.
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

# Two releases building at once would race for the same tag and for the README
# commit. Queue them instead of cancelling: every push that changes the app
# deserves a build.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # The logic tests are a plain SwiftPM package: no Xcode project, no
      # signing, no simulator. They fail fast and cost a minute.
      - name: Logic tests
        run: cd Packages/Core && swift test

      - name: Browser authentication lifecycle
        run: python3 tools/test_authentication.py

  # Whether anything in the app changed since the previous release. The answer
  # comes from the tool that writes the release notes, so what is listed and
  # what is built are one question asked twice — a build that lists nothing
  # cannot happen by accident, and neither can a list nobody built.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.ask.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The previous release's tag, and the commits since it. The tool
          # refuses a shallow checkout rather than read it as "no release yet".
          fetch-depth: 0

      - name: Ask the tool
        id: ask
        run: |
          set -euo pipefail
          # Two statements, not `echo "changed=$(…)"`: a substitution that
          # fails inside an echo is an echo that succeeds, and the answer
          # written would be empty rather than the step failing.
          changed=$(python3 tools/release_notes.py changed)
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Something in the app changed since the previous release: $changed"

  release:
    name: Build and publish
    needs: [test, changes]
    # Only when something in the app changed — or on request, which is how a
    # rebuild is asked for: a new certificate, a re-notarisation.
    #
    # Spelled out rather than left to the implied success(). GitHub puts that in
    # front of an `if` naming no status function, and it covers every entry in
    # `needs` — so a `changes` job that failed for any reason at all took the
    # hand-started rebuild down with it, which is the one run whose whole point
    # is that it does not care what `changes` thinks. The tests still block
    # both; that part was right.
    if: >-
      ${{ !cancelled() && needs.test.result == 'success'
          && (needs.changes.outputs.app == 'true'
              || github.event_name == 'workflow_dispatch') }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          # The release notes are read from the history — see the changes job.
          fetch-depth: 0

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Work out the version
        id: v
        run: |
          set -euo pipefail
          # The marketing version belongs to the macOS target, and it is read
          # from that target's block rather than from the first line in the file
          # that happens to mention one. `grep -m1` took whichever target came
          # first: moving SoftcapiOS above Softcap — a reordering that changes
          # nothing about either — would have published 1.0.N in place of 0.1.N.
          # The updater compares numerically, so every installed copy would be
          # offered a version nothing published afterwards could supersede, and
          # no later release could take it back.
          BASE=$(awk '
            $0 == "  Softcap:"                         { inside = 1; next }
            /^  [A-Za-z]/                              { inside = 0 }
            inside && /^[[:space:]]*MARKETING_VERSION:/ {
                line = $0
                sub(/^[^:]*:[[:space:]]*/, "", line)
                gsub(/"/, "", line)
                print line
                exit
            }
          ' project.yml)
          # A version that could not be read is not one to guess at: a build
          # numbered ".7" alone sorts below everything ever published.
          if ! [[ "$BASE" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::project.yml's Softcap target names no MARKETING_VERSION (read '$BASE')"
            exit 1
          fi
          VERSION="${BASE}.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"    >> "$GITHUB_OUTPUT"
          echo "Building $VERSION"

      - name: Generate the Xcode project
        run: xcodegen generate

      # Built without signing on purpose. The entitlements ask for an app
      # group, and Xcode will not sign that under CODE_SIGN_STYLE=Manual
      # without a provisioning profile a runner cannot obtain. tools/sign_app.sh
      # applies the entitlements afterwards.
      - name: Build
        run: |
          set -euo pipefail
          xcodebuild -project Softcap.xcodeproj -scheme Softcap \
            -configuration Release -derivedDataPath build \
            MARKETING_VERSION="${{ steps.v.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build | grep -E "error:|warning:|BUILD" || true
          test -d build/Build/Products/Release/Softcap.app

      # Optional, and all or nothing. A Developer ID build that cannot then be
      # notarised meets a scarier first-launch dialog than the ad-hoc one, and
      # half a credential set used to fail the whole run at the notary step —
      # so anything short of the full six publishes the ad-hoc build instead,
      # and the release notes tell the reader how to open it.
      #
      #   MACOS_CERTIFICATE_P12        base64 of a Developer ID Application .p12
      #   MACOS_CERTIFICATE_PASSWORD   its export password
      #   MACOS_SIGNING_IDENTITY       e.g. "Developer ID Application: Name (TEAMID)"
      #   MACOS_TEAM_ID                the 10-character team identifier
      #
      # Notarisation asks for no credential of its own. ASC_KEY_ID,
      # ASC_ISSUER_ID and ASC_KEY_P8 are already here for the TestFlight
      # upload, and `notarytool` takes the same key. The pair this used to want
      # — an Apple ID and an app-specific password — was a fifth and sixth
      # secret to keep alive, and it belonged to a person rather than to the
      # team: an app-specific password is regenerated from a phone, and the
      # release lane would find that out at the next tag.
      #
      # Still all-or-nothing, for the reason the entry in DECISIONS gives: a
      # Developer ID build that is not notarised meets a worse first-launch
      # dialog than the ad-hoc one, so half a credential set publishes ad-hoc
      # rather than the worst of the three artefacts.
      - name: Import the signing certificate
        id: cert
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${CERT_P12:-}" ]      || missing+=(MACOS_CERTIFICATE_P12)
          [ -n "${CERT_PASSWORD:-}" ] || missing+=(MACOS_CERTIFICATE_PASSWORD)
          [ -n "${SIGN_IDENTITY:-}" ] || missing+=(MACOS_SIGNING_IDENTITY)
          [ -n "${TEAM_ID:-}" ]       || missing+=(MACOS_TEAM_ID)
          [ -n "${ASC_KEY_ID:-}" ]    || missing+=(ASC_KEY_ID)
          [ -n "${ASC_ISSUER_ID:-}" ] || missing+=(ASC_ISSUER_ID)
          [ -n "${ASC_KEY_P8:-}" ]    || missing+=(ASC_KEY_P8)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Publishing an ad-hoc signed build — not configured: ${missing[*]}."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          # Before the import rather than after it: an import that fails takes
          # the step with it under `set -e`, and the decoded certificate would
          # stay on the runner for everything that follows.
          trap 'rm -P "$RUNNER_TEMP/cert.p12"' EXIT
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          # Without this codesign would stop for a UI prompt no runner can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Sign
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: tools/sign_app.sh build/Build/Products/Release/Softcap.app

      - name: Package
        id: pkg
        run: |
          set -euo pipefail
          APP=build/Build/Products/Release/Softcap.app
          V="${{ steps.v.outputs.version }}"
          tools/make_dmg.sh "$APP" "$V" dist

          # A zipped .app alongside the image: it is what an in-app updater
          # would download later, and what people who dislike disk images want.
          # ditto rather than zip — it is the only one that keeps the signature
          # and the symlinks inside a bundle intact.
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/Softcap-$V.zip"

          # The fixed name is what /releases/latest/download/Softcap.dmg
          # resolves to, and it is why the README link never goes stale.
          cp "dist/Softcap-$V.dmg" dist/Softcap.dmg

          cd dist && shasum -a 256 ./*.dmg ./*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Notarisation is what removes the "cannot be opened" dialog on another
      # person's Mac. It needs a real certificate, so it only runs when one was
      # configured.
      #
      # The bundle is notarised and stapled first: stapling writes the ticket
      # into the bundle, and the bundle is what the image and the zip both
      # carry — stapling only the image left the app inside it ticketless, and
      # a first launch with no network failed exactly where notarisation
      # promises it cannot. Both artefacts are then rebuilt around the stapled
      # bundle, and the image is blessed in its own right, because Gatekeeper
      # assesses the thing that was downloaded before what is inside it.
      - name: Notarise
        if: steps.cert.outputs.signed == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          V="${{ steps.v.outputs.version }}"
          APP=build/Build/Products/Release/Softcap.app

          # Trimmed for the reason the TestFlight step gives: these are pasted
          # by hand into a prompt that shows only asterisks, and a trailing
          # space is indistinguishable from a revoked key by the time Apple
          # answers.
          ASC_KEY_ID="$(printf %s "$ASC_KEY_ID" | tr -d '[:space:]')"
          ASC_ISSUER_ID="$(printf %s "$ASC_ISSUER_ID" | tr -d '[:space:]')"

          # `notarytool` takes a path, unlike `altool`, so the key goes where
          # the run can clean it up rather than into a fixed directory.
          KEY="$RUNNER_TEMP/notary.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          chmod 600 "$KEY"
          # On the way out however it goes. `set -e` and a rejected submission
          # are the ordinary ways this step ends early, and a line at the bottom
          # would leave the key on the runner for every step after it. Same
          # idiom as the TestFlight upload below, for the same reason.
          trap 'rm -P "$KEY"' EXIT
          notarise() {
            xcrun notarytool submit "$1" \
              --key "$KEY" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait
          }

          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          notarise "$RUNNER_TEMP/notarize.zip"
          xcrun stapler staple "$APP"

          tools/make_dmg.sh "$APP" "$V" dist
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/Softcap-$V.zip"
          codesign --force --timestamp --sign "$SIGN_IDENTITY" "dist/Softcap-$V.dmg"
          notarise "dist/Softcap-$V.dmg"
          xcrun stapler staple "dist/Softcap-$V.dmg"

          cp "dist/Softcap-$V.dmg" dist/Softcap.dmg
          cd dist && shasum -a 256 ./*.dmg ./*.zip > SHA256SUMS.txt

      # What came out, rather than what the steps meant to produce.
      #
      # Signing is all-or-nothing and the run says which way it went in a
      # notice nobody reads. The two outcomes have different consequences on
      # somebody else's Mac, and until this step existed neither was ever
      # checked: a release could be published believing it was notarised
      # because the step did not fail, and the only place that showed
      # otherwise was the download.
      - name: Check what is about to be published
        run: |
          set -euo pipefail
          APP=build/Build/Products/Release/Softcap.app
          V="${{ steps.v.outputs.version }}"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -E "Identifier=|Authority=|TeamIdentifier=|flags=" || true

          if [ "${{ steps.cert.outputs.signed }}" = "true" ]; then
            codesign --verify --strict --verbose=2 "$APP"
            codesign -dv --verbose=4 "$APP" 2>&1 \
              | grep -q "Authority=Developer ID Application" || {
                echo "::error::A certificate was configured and the app is not Developer ID signed."
                exit 1
              }
            # The ticket, not the submission: stapling is what makes a first
            # launch with no network work, and it is the step that silently
            # applied to the wrong artefact once already.
            xcrun stapler validate "$APP"
            xcrun stapler validate "dist/Softcap-$V.dmg"
            spctl --assess --type execute -vv "$APP"
          else
            codesign -dv --verbose=4 "$APP" 2>&1 | grep -q "adhoc" || {
              echo "::error::No certificate was configured and the app is not ad-hoc signed either."
              exit 1
            }
            echo "::warning::Published ad-hoc: the keychain binds access to the signature, an ad-hoc signature is new in every build, and so everyone updating has to let this version back in to their saved accounts."
          fi

      - name: Release notes
        id: notes
        run: |
          set -euo pipefail
          # The list first. The Updates screen in the app shows the top of this
          # body in a box a few lines tall, and a checksum is not what somebody
          # deciding whether to update wants to read there.
          python3 tools/release_notes.py notes \
            --tag "${{ steps.v.outputs.tag }}" \
            --repository "${{ github.repository }}" > notes.md
          {
            echo
            echo "**Install** — open the disk image and drag Softcap to Applications."
            echo
            if [ "${{ steps.cert.outputs.signed }}" != "true" ]; then
              echo "This build is signed ad-hoc rather than with an Apple Developer ID,"
              echo "so macOS will refuse it on first launch. To open it anyway:"
              echo
              echo '```'
              echo 'xattr -dr com.apple.quarantine /Applications/Softcap.app'
              echo '```'
              echo
              echo "Or right-click the app, choose Open, and confirm once."
              echo
              echo "An ad-hoc signature is also new in every build, and the keychain"
              echo "binds access to the signature — so this version arrives unable to"
              echo "read the accounts the last one saved. Open Settings → Accounts and"
              echo "press **Open saved accounts** once; nothing is lost."
              echo
            fi
            echo "### Checksums"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> notes.md
          cat notes.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: ${{ steps.v.outputs.version }}
          body_path: notes.md
          make_latest: true
          files: |
            dist/Softcap-${{ steps.v.outputs.version }}.dmg
            dist/Softcap-${{ steps.v.outputs.version }}.zip
            dist/Softcap.dmg
            dist/SHA256SUMS.txt

      # The store build is published by the same run, and that is the whole
      # point of it being here rather than anywhere else. The version is
      # `0.1.<run number>` — a number that exists only inside this run, so
      # anything building the store lane elsewhere, a second CI or a laptop,
      # has to predict it. A prediction that loses the race gives one string to
      # two different binaries, which is not hypothetical: TestFlight 0.1.5 and
      # the 0.1.5 published here were built from different commits, because
      # three pushes landed between choosing the number and using it.
      #
      # No certificate in a secret, unlike the Developer ID block above.
      # `-allowProvisioningUpdates` with an App Store Connect key uses cloud
      # signing, where the private key stays with Apple and the runner receives
      # only a signature — so these three are the whole configuration:
      #
      #   ASC_KEY_ID      the key's ten-character identifier
      #   ASC_ISSUER_ID   the issuer UUID, from Users and Access → Integrations
      #   ASC_KEY_P8      the contents of the AuthKey_….p8 file
      #   MACOS_TEAM_ID   the ten-character team identifier
      #
      # The team is a secret rather than a build setting because this repository
      # is public and the rule against publishing the Apple team identifier has
      # no exception for a workflow file. It is passed at archive time, not at
      # export: the identifier is stamped into the archive, and an archive built
      # without it fails the export with "No Team Found in Archive" — which is
      # what a runner does by default, since Signing.local.xcconfig holds the
      # team on the author's machine and is git-ignored.
      #
      # Last, and never blocking: the GitHub release is already published by
      # now, so a refused upload costs the store lane and nothing else.
      - name: Publish to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${ASC_KEY_ID:-}" ]    || missing+=(ASC_KEY_ID)
          [ -n "${ASC_ISSUER_ID:-}" ] || missing+=(ASC_ISSUER_ID)
          [ -n "${ASC_KEY_P8:-}" ]    || missing+=(ASC_KEY_P8)
          [ -n "${TEAM_ID:-}" ]       || missing+=(MACOS_TEAM_ID)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::notice::Not publishing to TestFlight — not configured: ${missing[*]}."
            exit 0
          fi

          # Trimmed, because these are pasted by hand into a prompt that shows
          # only asterisks, and a trailing space in the issuer id is indisting-
          # uishable from a revoked key by the time Apple answers.
          ASC_KEY_ID="$(printf %s "$ASC_KEY_ID" | tr -d '[:space:]')"
          ASC_ISSUER_ID="$(printf %s "$ASC_ISSUER_ID" | tr -d '[:space:]')"
          TEAM_ID="$(printf %s "$TEAM_ID" | tr -d '[:space:]')"

          # altool looks for the key by name in a handful of fixed directories
          # and takes no path, so this is where it has to be written.
          mkdir -p "$HOME/private_keys"
          KEY="$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          chmod 600 "$KEY"
          trap 'rm -P "$KEY"' EXIT

          # Ask Apple whether the key works before spending eight minutes on an
          # archive that needs it. Without this the answer arrives as a 401 from
          # a provisioning call, printed under "Communication with Apple failed"
          # — which reads like a network fault, and cost two releases before it
          # was read as what it is.
          ASC_KEY_PATH="$KEY" ASC_TEAM_ID="$TEAM_ID" python3 tools/asc_preflight.py

          V="${{ steps.v.outputs.version }}"

          # Its own derived data: the Developer ID build above is still on disk
          # and is a different app — sandboxed here, and with the updater
          # compiled out by APPSTORE.
          xcodebuild -project Softcap.xcodeproj -scheme Softcap \
            -configuration Release -derivedDataPath build-appstore \
            -archivePath "$RUNNER_TEMP/Softcap.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="" \
            SOFTCAP_APP_ENTITLEMENTS=App/Softcap.AppStore.entitlements \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=APPSTORE \
            MARKETING_VERSION="$V" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive | grep -E "error:|ARCHIVE"

          # Ad-hoc above, and a team here, because a runner holds no certificate
          # and each simpler answer fails differently. Archiving with the
          # project's manual identity looks for "Mac Development" and finds
          # none. Archiving with signing switched off gets past that, and Apple
          # then rejects the upload with "App sandbox not enabled": entitlements
          # are applied while signing, so an unsigned build carries none, and
          # the export cannot add what was never there. Ad-hoc costs no
          # certificate and embeds them — the export replaces the signature and
          # keeps them. What ad-hoc does not record is the team, hence this.
          cp tools/ExportOptions.AppStore.plist "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" \
            "$RUNNER_TEMP/ExportOptions.plist"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Softcap.xcarchive" \
            -exportPath "$RUNNER_TEMP/appstore-export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | grep -E "error:|Exported|EXPORT"

          xcrun altool --upload-app \
            -f "$RUNNER_TEMP/appstore-export/Softcap.pkg" -t macos \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "::notice::Uploaded $V (build ${{ github.run_number }}) to TestFlight."

      # The download URL is fixed, so this only refreshes the version and date
      # shown next to it. It rewrites one marked block and commits nothing when
      # that block is unchanged.
      - name: Refresh the README download block
        run: |
          set -euo pipefail
          V="${{ steps.v.outputs.version }}"
          TAG="${{ steps.v.outputs.tag }}"
          REPO="${{ github.repository }}"
          python3 - "$V" "$TAG" "$REPO" <<'PY'
          import re, sys, datetime, pathlib
          version, tag, repo = sys.argv[1:4]
          # UTC, like the release notes beside it and for the reason DECISIONS
          # gives on 2026-09-14: a release is dated when it was published, not
          # where the author was standing. A runner happens to be set to UTC,
          # so `date.today()` was right by luck rather than by saying so.
          today = datetime.datetime.now(datetime.timezone.utc).date()
          block = (
              "<!-- download:start -->\n"
              f"### [⬇︎ Download Softcap {version}]"
              f"(https://github.com/{repo}/releases/latest/download/Softcap.dmg)\n\n"
              f"A disk image for macOS 14 and later. Released "
              f"{today:%d %B %Y} — "
              f"[all versions](https://github.com/{repo}/releases/tag/{tag}).\n"
              "<!-- download:end -->"
          )
          path = pathlib.Path("README.md")
          text = path.read_text(encoding="utf-8")
          new = re.sub(
              r"<!-- download:start -->.*?<!-- download:end -->",
              lambda _: block, text, count=1, flags=re.S,
          )
          if new != text:
              path.write_text(new, encoding="utf-8")
              print("README updated")
          else:
              print("README already current")
          PY

          if git diff --quiet README.md; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Point the README download link at $V [skip ci]"
          # Someone may have pushed while the build ran; rebase rather than
          # force, so their commit survives.
          git pull --rebase origin main
          git push origin HEAD:main
