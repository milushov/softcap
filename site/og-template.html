<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#0e0e12;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#e9e9ee;
  display:flex;flex-direction:column;justify-content:center;padding:0 70px;position:relative}
.glow{position:absolute;inset:0;background:radial-gradient(85% 60% at 22% 8%,rgba(52,199,89,.11),transparent 62%)}
.in{position:relative}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:44px}
.brand b{font-size:26px;font-weight:600;letter-spacing:-.01em}
h1{font-size:54px;line-height:1.08;letter-spacing:-.032em;font-weight:640;max-width:26ch}
/* Its own line by construction, not by luck — the page learned this and
   this file did not, so every share showed "limit," and "on one screen."
   running together on one line with the two halves in different colours. */
h1 em{display:block;font-style:normal;color:#828291}
p{margin-top:26px;font-size:23px;line-height:1.45;color:#9a9aa6;max-width:24ch}
.foot{position:absolute;left:70px;bottom:52px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:19px;color:#828291;letter-spacing:.01em}
.foot b{color:#34c759;font-weight:500}
/* The strip is the point: this lives at the top of the screen, and the window
   only appears when asked. A preview that shows the window alone says "an app";
   a preview that shows the strip says which kind. */
.screen{position:absolute;right:56px;top:74px;width:392px}
.bar{display:flex;align-items:center;justify-content:flex-end;gap:14px;height:28px;
  padding:0 12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);
  border-radius:9px 9px 0 0;font-size:12px;color:#9a9aa6}
.bar .i{opacity:.5}
.bar .me{display:inline-flex;align-items:center;gap:5px;color:#e9e9ee;
  padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.11);
  font-variant-numeric:tabular-nums}
.bar svg{display:block}
.win{width:330px;margin-left:auto;background:#1a1a21;border:1px solid #2b2b35;
  border-radius:14px;box-shadow:0 34px 80px -20px rgba(0,0,0,.8);overflow:hidden;padding:5px 0}
.r{padding:11px 15px;border-top:1px solid #23232c}
.r:first-child{border-top:0}
.n{font-size:14.5px;font-weight:600;letter-spacing:-.005em}
.s{font-size:12px;color:#828291;margin-top:2px}
.m{display:flex;align-items:center;gap:9px;margin-top:8px;font-variant-numeric:tabular-nums}
.k{width:38px;font-size:12px;color:#828291}
.b{flex:1;height:4.5px;border-radius:3px;background:#2c2c36;overflow:hidden}
.b i{display:block;height:100%;border-radius:3px}
.v{width:44px;text-align:right;font-size:12.5px}
</style></head><body>
<div class="glow"></div>
<div class="in">
  <div class="brand">
    <svg width="40" height="40" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="14.3" fill="#1c1c22"/>
      <circle cx="32" cy="32" r="21" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="5"/>
      <circle cx="32" cy="32" r="21" fill="none" stroke="#34c759" stroke-width="5" stroke-linecap="round"
              stroke-dasharray="85.8 131.9" transform="rotate(-90 32 32)"/>
      <circle cx="32" cy="32" r="11.5" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="3.6"/>
      <circle cx="32" cy="32" r="11.5" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round"
              stroke-dasharray="21.7 50.5" transform="rotate(-90 32 32)"/>
    </svg>
    <b>Softcap</b>
  </div>
  <h1>Every subscription limit, <em>on one screen.</em></h1>
  <p>Claude Code and Codex, side by side in the menu bar.</p>
</div>
<div class="foot">macOS · <b>in development</b></div>
<div class="screen">
<div class="bar">
  <span class="i"><svg width="13" height="13" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M2 4h8M2 6h8M2 8h5"/></svg></span>
  <span class="i"><svg width="13" height="13" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="1.5" y="3" width="9" height="6" rx="1.4"/><path d="M11 5v2"/></svg></span>
  <span class="me">
    <svg width="13" height="13" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.4" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-width="2.7"/>
      <circle cx="12" cy="12" r="8.4" fill="none" stroke="currentColor" stroke-width="2.7"
              stroke-linecap="round" stroke-dasharray="34.3 52.8" transform="rotate(-90 12 12)"/>
    </svg>0:41
  </span>
  <span class="i">2:41&nbsp;AM</span>
</div>
<div class="win">
  <div class="r">
    <div class="n">alex@example.com</div><div class="s">Codex · Plus</div>
    <div class="m"><span class="k">5h</span><span class="b"><i style="width:2%;background:#34c759"></i></span><span class="v" style="color:#9a9aa6">0%</span></div>
    <div class="m"><span class="k">week</span><span class="b"><i style="width:39%;background:#34c759"></i></span><span class="v" style="color:#9a9aa6">39%</span></div>
  </div>
  <div class="r">
    <div class="n">sam@example.com</div><div class="s">Claude · Max 20x</div>
    <div class="m"><span class="k">5h</span><span class="b"><i style="width:16%;background:#34c759"></i></span><span class="v" style="color:#9a9aa6">16%</span></div>
    <div class="m"><span class="k">week</span><span class="b"><i style="width:80%;background:#e8963c"></i></span><span class="v" style="color:#e8963c">80%</span></div>
  </div>
  <div class="r">
    <div class="n">sam.k@example.com</div><div class="s">Claude · Max 20x</div>
    <div class="m"><span class="k">5h</span><span class="b"><i style="width:100%;background:#e8574a"></i></span><span class="v" style="color:#e8574a">100%</span></div>
    <div class="m"><span class="k">week</span><span class="b"><i style="width:55%;background:#e5c04b"></i></span><span class="v" style="color:#e5c04b">55%</span></div>
  </div>
</div>
</div>
</body></html>
